<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renewray Operations Desk</title>
  <style>
    :root {
      --primary: #1976d2;
      --primary-hover: #1565c0;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --danger: #cf222e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      max-width: 650px;
      margin: 0 auto;
    }

    /* Single Header (No other options/tabs) */
    .header-title {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      padding: 12px;
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      color: var(--primary);
    }

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 14px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--muted);
    }

    input, select {
      width: 100%;
      padding: 9px 10px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
    }

    /* Add Item Layout */
    .add-item-box {
      margin-bottom: 12px;
    }
    .add-item-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-search-item {
      flex: 1;
      margin-bottom: 0 !important;
    }
    .input-qty-item {
      width: 75px !important;
      margin-bottom: 0 !important;
      text-align: center;
    }
    .btn-add-submit {
      padding: 8px 16px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      height: 36px;
    }
    .btn-add-submit:hover {
      background: var(--primary-hover);
    }

    /* Selected Items Table */
    .selected-items-wrapper {
      margin-top: 10px;
    }
    .table-responsive {
      overflow-x: auto;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }
    th {
      background: #f6f8fa;
      color: var(--text);
      font-weight: 600;
      padding: 8px 10px;
      border-bottom: 1px solid #e1e4e8;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #eaecef;
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .empty-state {
      padding: 14px 10px;
      color: #8c959f;
      text-align: center;
    }

    .btn-remove-row {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 6px;
    }

    .submit-button {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
    }
    .submit-button:disabled {
      background: #94a3b8;
    }

    .hidden { display: none !important; }
    .status-msg {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Dynamic Header: Shows ONLY the current mode -->
  <div class="header-title" id="formHeaderTitle">Loading Form...</div>

  <div id="mainFormContainer">
    <!-- Party Block -->
    <div class="card">
      <div class="card-title" id="partyBlockTitle">Party Information</div>
      
      <!-- DC & BOM Party Section -->
      <div id="clientBlock">
        <label>Client / Buyer Name:</label>
        <select id="clientSelect" onchange="onClientChange()">
          <option value="">-- Master Client Chunein --</option>
        </select>
        <input type="text" id="clientNameCustom" placeholder="Ya Naya Client Name type karein">

        <label>Address / Site Location:</label>
        <input type="text" id="clientAddress" placeholder="Full Address">

        <div id="posWrapper">
          <label>Place of Supply:</label>
          <input type="text" id="placeOfSupply" value="Rajasthan">
        </div>

        <div id="bomMetaWrapper" class="hidden">
          <label>Plant Capacity:</label>
          <input type="text" id="plantCapacity" placeholder="e.g. 10 KW">
          <label>Site Survey By:</label>
          <input type="text" id="siteSurvey" placeholder="e.g. Site Engineer" value="Site Engineer">
        </div>
      </div>

      <!-- GRN Vendor Section -->
      <div id="vendorBlock" class="hidden">
        <label>Vendor / Supplier Name:</label>
        <select id="vendorSelect" onchange="onVendorChange()">
          <option value="">-- Master Vendor Chunein --</option>
        </select>
        <input type="text" id="vendorNameCustom" placeholder="Ya Naya Vendor Name type karein">

        <label>GSTIN:</label>
        <input type="text" id="vendorGst" placeholder="Vendor GSTIN">

        <label>Supplier Challan / Inv No:</label>
        <input type="text" id="challanRef" placeholder="Challan / Invoice Reference">
      </div>
    </div>

    <!-- Items Section -->
    <div class="card">
      <div class="add-item-box">
        <div class="card-title">Add Item</div>
        <div class="add-item-row">
          <input list="itemsDataList" id="itemSearchInput" class="input-search-item" placeholder="Type to search item...">
          <datalist id="itemsDataList"></datalist>

          <input type="number" id="itemQtyInput" class="input-qty-item" value="1" min="1" placeholder="Qty">
          <button type="button" class="btn-add-submit" onclick="addPickedItemToList()">+ Add</button>
        </div>
      </div>

      <div class="selected-items-wrapper">
        <div class="card-title">Selected Items</div>
        <div class="table-responsive">
          <table id="selectedItemsTable">
            <thead id="itemsThead"></thead>
            <tbody id="itemsTbody">
              <tr>
                <td colspan="5" class="empty-state">No items added yet - search above and tap + Add.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <button type="button" class="submit-button" id="submitBtn" onclick="submitFormData()">Generate Document</button>
  </div>

  <div id="statusMsg" class="status-msg"></div>

  <script>
    var SCRIPT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzcRCukDoJQWyERBD61i_MkEexI45ZTh6LGpLxawPtA9qxFXL9blQ9PJFLvhFDh31Yy/exec";

    // Auto case-insensitive check
    var urlParams = new URLSearchParams(window.location.search);
    var rawMode = (urlParams.get('mode') || "DC").toString().trim().toUpperCase();
    var currentMode = (rawMode === "GRN" || rawMode === "BOM") ? rawMode : "DC";

    var userChatId = urlParams.get('chatId') || "";
    var masterData = { clients: [], vendors: [], items: [] };
    var selectedItemsArray = [];

    function setupPageMode() {
      var titleDiv = document.getElementById('formHeaderTitle');
      var clientBlock = document.getElementById('clientBlock');
      var vendorBlock = document.getElementById('vendorBlock');
      var posWrapper = document.getElementById('posWrapper');
      var bomMetaWrapper = document.getElementById('bomMetaWrapper');
      var thead = document.getElementById('itemsThead');

      if (currentMode === "DC") {
        titleDiv.textContent = "📄 Delivery Challan (DC)";
        clientBlock.classList.remove('hidden');
        vendorBlock.classList.add('hidden');
        posWrapper.classList.remove('hidden');
        bomMetaWrapper.classList.add('hidden');
        thead.innerHTML = "<tr><th>Item</th><th style='width:65px;'>HSN</th><th style='width:55px;'>Qty</th><th style='width:50px;'>Unit</th><th style='width:30px;'></th></tr>";
      } else if (currentMode === "GRN") {
        titleDiv.textContent = "📥 Goods Receipt Note (GRN)";
        clientBlock.classList.add('hidden');
        vendorBlock.classList.remove('hidden');
        thead.innerHTML = "<tr><th>Item</th><th style='width:55px;'>Billed</th><th style='width:55px;'>Rcvd</th><th style='width:55px;'>Acc</th><th style='width:30px;'></th></tr>";
      } else if (currentMode === "BOM") {
        titleDiv.textContent = "📋 BOM Material Requisition";
        clientBlock.classList.remove('hidden');
        vendorBlock.classList.add('hidden');
        posWrapper.classList.add('hidden');
        bomMetaWrapper.classList.remove('hidden');
        thead.innerHTML = "<tr><th>Material Description</th><th style='width:70px;'>Qty</th><th style='width:60px;'>Unit</th><th style='width:30px;'></th></tr>";
      }
    }

    setupPageMode();

    fetch(SCRIPT_ENDPOINT + "?action=getMasterData")
      .then(function(res) { return res.json(); })
      .then(function(data) {
        masterData = data;
        populateDropdowns();
      })
      .catch(function(err) {});

    function populateDropdowns() {
      var cSelect = document.getElementById('clientSelect');
      if (masterData.clients) {
        masterData.clients.forEach(function(c, i) {
          var opt = document.createElement('option');
          opt.value = i;
          opt.textContent = c.name + " (" + (c.address.split(',')[0] || '') + ")";
          cSelect.appendChild(opt);
        });
      }

      var vSelect = document.getElementById('vendorSelect');
      if (masterData.vendors) {
        masterData.vendors.forEach(function(v, i) {
          var opt = document.createElement('option');
          opt.value = i;
          opt.textContent = v.name + (v.city ? " - " + v.city : "");
          vSelect.appendChild(opt);
        });
      }

      var dList = document.getElementById('itemsDataList');
      dList.innerHTML = "";
      if (masterData.items) {
        masterData.items.forEach(function(it) {
          var opt = document.createElement('option');
          opt.value = it.name;
          dList.appendChild(opt);
        });
      }
    }

    function onClientChange() {
      var val = document.getElementById('clientSelect').value;
      if (val !== "") {
        var c = masterData.clients[parseInt(val, 10)];
        document.getElementById('clientNameCustom').value = c.name;
        document.getElementById('clientAddress').value = c.address;
        document.getElementById('placeOfSupply').value = c.placeOfSupply || "Rajasthan";
      }
    }

    function onVendorChange() {
      var val = document.getElementById('vendorSelect').value;
      if (val !== "") {
        var v = masterData.vendors[parseInt(val, 10)];
        document.getElementById('vendorNameCustom').value = v.name;
        document.getElementById('vendorGst').value = v.gst;
      }
    }

    function addPickedItemToList() {
      var nameInput = document.getElementById('itemSearchInput');
      var qtyInput = document.getElementById('itemQtyInput');

      var nameVal = nameInput.value.trim();
      var qtyVal = Number(qtyInput.value) || 1;

      if (!nameVal) {
        alert("Please enter or select an item name!");
        return;
      }

      var hsn = "N/A";
      var unit = "Nos";
      if (masterData.items) {
        var found = masterData.items.find(function(it) {
          return it.name.toLowerCase() === nameVal.toLowerCase();
        });
        if (found) {
          hsn = found.hsn || "N/A";
          unit = found.unit || "Nos";
        }
      }

      selectedItemsArray.push({
        name: nameVal,
        qty: qtyVal,
        hsn: hsn,
        unit: unit,
        billedQty: qtyVal,
        rcvdQty: qtyVal,
        acceptedQty: qtyVal
      });

      nameInput.value = "";
      qtyInput.value = "1";
      renderSelectedItemsTable();
    }

    function removeSelectedItem(idx) {
      selectedItemsArray.splice(idx, 1);
      renderSelectedItemsTable();
    }

    function renderSelectedItemsTable() {
      var tbody = document.getElementById('itemsTbody');

      if (selectedItemsArray.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No items added yet - search above and tap + Add.</td></tr>';
        return;
      }

      var html = "";
      selectedItemsArray.forEach(function(item, idx) {
        if (currentMode === "DC") {
          html += `
            <tr>
              <td><b>${item.name}</b></td>
              <td>${item.hsn}</td>
              <td>${item.qty}</td>
              <td>${item.unit}</td>
              <td><button type="button" class="btn-remove-row" onclick="removeSelectedItem(${idx})">✕</button></td>
            </tr>
          `;
        } else if (currentMode === "GRN") {
          html += `
            <tr>
              <td><b>${item.name}</b></td>
              <td>${item.billedQty}</td>
              <td>${item.rcvdQty}</td>
              <td>${item.acceptedQty}</td>
              <td><button type="button" class="btn-remove-row" onclick="removeSelectedItem(${idx})">✕</button></td>
            </tr>
          `;
        } else if (currentMode === "BOM") {
          html += `
            <tr>
              <td><b>${item.name}</b></td>
              <td>${item.qty}</td>
              <td>${item.unit}</td>
              <td><button type="button" class="btn-remove-row" onclick="removeSelectedItem(${idx})">✕</button></td>
            </tr>
          `;
        }
      });

      tbody.innerHTML = html;
    }

    function submitFormData() {
      var submitBtn = document.getElementById('submitBtn');
      var statusMsg = document.getElementById('statusMsg');

      if (selectedItemsArray.length === 0) {
        alert("Please add at least one item using '+ Add' button!");
        return;
      }

      submitBtn.disabled = true;
      statusMsg.innerHTML = "<span style='color:var(--primary); font-size:14px;'>⏳ Generating document, please wait...</span>";

      var payload = {
        mode: currentMode,
        chatId: userChatId,
        items: []
      };

      if (currentMode === "DC" || currentMode === "BOM") {
        payload.clientName = document.getElementById('clientNameCustom').value.trim();
        payload.clientAddress = document.getElementById('clientAddress').value.trim();
        payload.placeOfSupply = document.getElementById('placeOfSupply').value.trim();
        payload.plantCapacity = document.getElementById('plantCapacity').value.trim();
        payload.siteSurvey = document.getElementById('siteSurvey').value.trim();
        if (!payload.clientName) {
          alert("Please enter Client Name!");
          submitBtn.disabled = false;
          statusMsg.innerHTML = "";
          return;
        }
      } else if (currentMode === "GRN") {
        payload.vendorName = document.getElementById('vendorNameCustom').value.trim();
        payload.vendorGst = document.getElementById('vendorGst').value.trim();
        payload.challanRef = document.getElementById('challanRef').value.trim();
        if (!payload.vendorName) {
          alert("Please enter Vendor Name!");
          submitBtn.disabled = false;
          statusMsg.innerHTML = "";
          return;
        }
      }

      selectedItemsArray.forEach(function(item) {
        if (currentMode === "DC") {
          payload.items.push({
            name: item.name,
            qty: item.qty,
            unit: item.unit,
            hsn: item.hsn
          });
        } else if (currentMode === "GRN") {
          payload.items.push({
            name: item.name,
            billedQty: item.billedQty,
            rcvdQty: item.rcvdQty,
            acceptedQty: item.acceptedQty,
            rejectedQty: Math.max(0, Number(item.rcvdQty) - Number(item.acceptedQty)),
            remarks: "OK"
          });
        } else if (currentMode === "BOM") {
          payload.items.push({
            name: item.name,
            qtyIssued: item.qty,
            unit: item.unit,
            remarks: ""
          });
        }
      });

      fetch(SCRIPT_ENDPOINT, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(function() {
        document.getElementById('mainFormContainer').style.display = 'none';
        statusMsg.innerHTML = `
          <div style="background:#e8f5e9; border: 1px solid #81c784; padding:24px; border-radius:8px; margin-top:15px; color:#2e7d32; text-align:center;">
            <div style="font-size:36px; margin-bottom:8px;">✅</div>
            <b style="font-size:16px;">Document Submitted Successfully!</b><br>
            <p style="font-size:13px; color:#555; margin-top:6px;">Document is generated and saved in Google Drive.</p>
            <br>
            <button onclick="location.reload()" style="padding:10px 18px; background:var(--primary); color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">➕ Create Another Entry</button>
          </div>
        `;
      })
      .catch(function(err) {
        alert("Submission failed. Check network.");
        submitBtn.disabled = false;
        statusMsg.innerHTML = "";
      });
    }
  </script>
</body>
</html>
